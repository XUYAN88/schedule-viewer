<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>档期查询</title>
<style>
  :root {
    --red:#a83226; --red-deep:#8c2a20; --red-dark:#7a231a;
    --gold:#e8c98a; --gold-deep:#d4a95e;
    --bg:#f7f5f2; --card:#ffffff; --line:#f0ece6;
    --ink:#2d3436; --ink-soft:#6b5d4e; --muted:#8d847a; --faint:#b5aa9c;
    --open:#3e9c6e; --full:#e8a13c; --closed:#e5645c;
    --shadow:0 4px 18px rgba(60,40,20,.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  button { font-family:inherit; touch-action:manipulation; }
  /* ===== 移动端触控优化 ===== */
  html, body { overscroll-behavior-y:contain; }
  button, .day, .closed-day, .store-btn, .cal-nav button {
    -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .day { transition:transform .1s ease; }
  .day:active { transform:scale(.92); }
  .store-btn, .cal-nav button, .closed-day { touch-action:manipulation; }
  .store-bar { scroll-snap-type:x proximity; }
  .store-btn { scroll-snap-align:start; }

  /* ===== 加载遮罩 & 顶部刷新提示 ===== */
  .loading-mask {
    position:fixed; inset:0; z-index:100; background:rgba(247,245,242,.97);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--muted); font-size:13px; letter-spacing:1px;
  }
  .loading-mask.hide { display:none; }
  .spinner {
    width:38px; height:38px; border-radius:50%; border:3px solid #f0e6d8;
    border-top-color:#b8432f; animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .refresh-bar {
    position:fixed; top:0; left:0; right:0; z-index:60; display:none;
    background:rgba(232,180,60,.97); color:#5c4308; font-size:11px; font-weight:600;
    text-align:center; padding:6px 8px; letter-spacing:1px;
  }
  .refresh-bar.show { display:block; animation:slideDown .25s ease; }

  /* ===== 头部 ===== */
  .header {
    background:linear-gradient(155deg,#9c2b20 0%,#8c2a20 48%,#7a231a 100%);
    color:#fff; padding:28px 20px 34px; text-align:center; position:relative; overflow:hidden;
  }
  .header::before {
    content:""; position:absolute; top:-60%; left:-20%; width:140%; height:140%;
    background:radial-gradient(circle at 30% 20%, rgba(255,215,150,.20), transparent 55%);
    pointer-events:none;
  }
  .header::after {
    content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:52px; height:3px; border-radius:2px; background:linear-gradient(90deg,#e8c98a,#d4a95e);
  }
  .header h1 { font-size:22px; font-weight:700; letter-spacing:6px; text-shadow:0 1px 3px rgba(0,0,0,.22); }
  .header .sub { font-size:11px; opacity:.86; margin-top:7px; letter-spacing:1.5px; }
  .updated { font-size:10px; opacity:.62; margin-top:8px; letter-spacing:.5px; }
  .refresh-btn {
    position:absolute; top:14px; right:14px; z-index:2;
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(255,255,255,.18); color:#fff; font-size:16px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .2s, transform .2s;
  }
  .refresh-btn:active { transform:scale(.9); background:rgba(255,255,255,.32); }
  .refresh-btn.spinning { animation:spin .9s linear infinite; }

  /* ===== 门店切换 ===== */
  .store-bar {
    display:flex; gap:8px; overflow-x:auto; padding:12px 12px 14px;
    background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch;
    position:sticky; top:0; z-index:10; box-shadow:0 2px 12px rgba(0,0,0,.04);
  }
  .store-bar::-webkit-scrollbar { display:none; }
  .store-btn {
    flex:0 0 auto; background:#f4f1ec; border:1px solid transparent; border-radius:999px;
    padding:8px 16px; font-size:12px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
    transition:all .18s ease; min-height:36px;
  }
  .store-btn:active { transform:scale(.96); }
  .store-btn.active {
    background:linear-gradient(135deg,#b8432f,#9c3523); color:#fff; font-weight:600;
    box-shadow:0 3px 10px rgba(184,67,47,.32);
  }

  /* ===== 变化提醒横幅 ===== */
  .banner {
    display:none; margin:12px 12px 0; padding:13px 15px; border-radius:14px;
    font-size:12px; line-height:1.7; background:#fff8e6;
    border:1px solid #f0d9a8; border-left:4px solid #e8b43c; color:#8a6d1d;
  }
  .banner.show { display:block; animation:slideDown .3s ease; }
  @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
  .banner .t { font-weight:700; margin-bottom:3px; display:flex; align-items:center; gap:5px; }
  .banner b.closed { color:#d32f2f; }
  .banner b.open { color:#2e7d32; }

  /* ===== 温馨提示声明 ===== */
  .notice {
    margin:12px 12px 0; padding:12px 15px; border-radius:14px;
    background:linear-gradient(135deg,#fdf6ec,#fbf0dd); border:1px solid #ecd9b4;
    font-size:12px; line-height:1.8; color:#7a5c22;
  }
  .notice b { color:#b8432f; }

  /* ===== 卡片 ===== */
  .card {
    background:var(--card); margin:12px; border-radius:18px;
    box-shadow:var(--shadow); padding:18px; border:1px solid #f3efe9;
  }
  .card h2 {
    font-size:15px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px;
    color:#3d3128;
  }
  .card h2 .dot { width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 0 3px rgba(0,0,0,.05); flex:0 0 auto; }
  .card h2 .store-name { margin-left:auto; font-size:11px; color:var(--faint); font-weight:400; white-space:nowrap; }

  /* ===== 图例 ===== */
  .legend { display:flex; gap:14px; font-size:11px; color:var(--muted); margin-bottom:14px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:13px; height:13px; border-radius:5px; display:inline-block; }
  .legend .i-closed { background:#e5645c; }
  .legend .i-half { background:linear-gradient(to bottom,#e5645c 50%,#f4f1ec 50%); border:1px solid #e8e2d8; }
  .legend .i-full { background:#e8a13c; }
  .legend .i-open { background:#4caf7d; }
  .legend .i-normal { background:#f4f1ec; border:1px solid #e8e2d8; }

  /* ===== 日历 ===== */
  .cal-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-nav button {
    background:#f4f1ec; border:none; border-radius:12px; padding:7px 16px;
    font-size:13px; color:var(--ink-soft); cursor:pointer; transition:all .18s; min-height:36px;
  }
  .cal-nav button:active { transform:scale(.94); background:#eae4da; }
  .cal-nav .ym { font-size:17px; font-weight:700; color:#3d3128; letter-spacing:1px; }
  .cal-head, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-head { font-size:10px; color:var(--faint); text-align:center; margin-bottom:6px; }
  .cal-grid { row-gap:5px; }
  .day {
    aspect-ratio:1/1; border-radius:12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:13px; position:relative;
    background:#faf8f5; border:1px solid #f0ebe3; transition:transform .12s ease;
  }
  .day .d { font-size:14px; font-weight:600; position:relative; z-index:1; }
  .day .tag { font-size:8px; margin-top:1px; position:relative; z-index:1; letter-spacing:0; white-space:nowrap; }
  .day.closed { background:linear-gradient(160deg,#e5645c,#d9524a); color:#fff; border-color:transparent; box-shadow:0 3px 8px rgba(229,100,92,.32); }
  .day.full { background:linear-gradient(160deg,#e8a13c,#de9430); color:#fff; border-color:transparent; box-shadow:0 3px 8px rgba(232,161,60,.32); }
  .day.open { background:linear-gradient(160deg,#4caf7d,#3e9c6e); color:#fff; border-color:transparent; box-shadow:0 3px 8px rgba(76,175,125,.28); }
  .day.closed .tag, .day.full .tag, .day.open .tag { color:rgba(255,255,255,.94); }
  .day.other-month { visibility:hidden; background:transparent; border:none; box-shadow:none; }
  .day.today { outline:2px solid var(--red); outline-offset:1px; }

  .day.half { background:#faf8f5; color:#3d3128; }
  .day.half .half-bar { position:absolute; left:0; right:0; height:50%; z-index:0; }
  .day.half .half-bar.top { top:0; background:#e5645c; border-radius:11px 11px 0 0; }
  .day.half .half-bar.bottom { bottom:0; background:#e5645c; border-radius:0 0 11px 11px; }
  .day.half .tag { color:#c94a42; font-weight:700; }

  /* 变化高亮 */
  .day.changed { animation:flash 1.2s ease-in-out 3; }
  @keyframes flash {
    0%,100% { box-shadow:0 0 0 0 rgba(232,180,60,.9); }
    50% { box-shadow:0 0 0 5px rgba(232,180,60,.4); }
  }
  .day.changed::after {
    content:"NEW"; position:absolute; top:-5px; right:-5px; background:#e8b43c; color:#5c4308;
    font-size:7px; font-weight:800; padding:1px 4px; border-radius:6px; z-index:2;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }

  /* ===== 不可约日期（横向排列标签） ===== */
  .city-group { margin-bottom:18px; }
  .city-group:last-child { margin-bottom:0; }
  .city-title {
    font-size:13px; font-weight:700; color:var(--red); letter-spacing:2px;
    padding:6px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .city-title::before { content:""; width:4px; height:14px; border-radius:2px; background:linear-gradient(180deg,#b8432f,#9c3523); }
  .city-title .count {
    margin-left:auto; font-size:10px; font-weight:400; color:var(--faint); letter-spacing:0;
    background:#f7f4ef; padding:2px 9px; border-radius:10px;
  }
  .store-sub {
    font-size:11px; color:var(--muted); font-weight:600; margin:11px 0 7px 4px;
    display:flex; align-items:center; gap:6px;
  }
  .store-sub::before { content:""; width:4px; height:4px; border-radius:50%; background:var(--faint); }
  .store-sub .s-count { margin-left:auto; font-size:10px; color:var(--faint); font-weight:400; }
  .chips-wrap { display:flex; flex-wrap:wrap; gap:8px; padding-left:2px; }
  .closed-day {
    display:inline-flex; align-items:center;
    padding:8px 12px; background:#fdf7f5; border:1px solid #f3ddd8;
    border-radius:14px; transition:all .15s; box-shadow:0 1px 2px rgba(60,40,20,.03);
  }
  .closed-day:active { transform:scale(.96); }
  .closed-day .cd-date { font-weight:700; color:#3d3128; font-size:12px; white-space:nowrap; }
  .closed-day .cd-date .w { font-size:10px; color:var(--faint); font-weight:400; margin-left:4px; }
  .closed-day .cd-meals { display:flex; gap:4px; margin-left:7px; }
  .closed-day .m {
    display:inline-block; padding:3px 10px; border-radius:10px; font-size:10px;
    color:#fff; font-weight:600; letter-spacing:1px;
  }
  .closed-day .m.lunch { background:linear-gradient(135deg,#4a8fd4,#3b7cc0); }
  .closed-day .m.dinner { background:linear-gradient(135deg,#8e6bb8,#7b57a8); }
  .closed-day .m.none { background:#e57373; }
  .none { font-size:12px; color:var(--faint); padding:12px 0; text-align:center; }

  .footer { text-align:center; font-size:10px; color:var(--faint); padding:18px 0 28px; letter-spacing:1px; }

  /* ===== 2026 UI polish：更紧凑、更清晰的移动端层级 ===== */
  :root {
    --red:#9f3528; --red-deep:#86291f; --red-dark:#6f211a;
    --gold:#e8c78a; --gold-deep:#c99748;
    --bg:#f6f3ef; --card:#fff; --line:#ebe5dd;
    --ink:#292421; --ink-soft:#645a52; --muted:#8a817a; --faint:#aaa19a;
    --open:#35a36f; --full:#e5a03f; --closed:#df6159;
    --shadow:0 8px 30px rgba(72,48,32,.075);
  }
  html { background:#e9e3dc; }
  body {
    min-height:100vh; max-width:680px; margin:0 auto; padding-bottom:env(safe-area-inset-bottom);
    background:
      radial-gradient(circle at 100% 8%,rgba(201,151,72,.08),transparent 25%),
      var(--bg);
    box-shadow:0 0 60px rgba(55,38,25,.08);
  }
  button:focus-visible { outline:3px solid rgba(232,199,138,.8); outline-offset:2px; }

  .loading-mask { max-width:680px; left:50%; right:auto; width:100%; transform:translateX(-50%); }
  .spinner { width:34px; height:34px; border-width:2px; }
  .refresh-bar {
    top:auto; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; right:auto;
    width:auto; min-width:148px; max-width:calc(100% - 32px); transform:translateX(-50%);
    padding:9px 16px; border-radius:999px; background:rgba(244,205,122,.97); color:#614511;
    box-shadow:0 8px 24px rgba(74,49,12,.18);
  }
  .refresh-bar.show { animation:refreshUp .22s ease; }
  @keyframes refreshUp { from { opacity:0; transform:translate(-50%,12px); } to { opacity:1; transform:translate(-50%,0); } }

  .header {
    padding:15px 60px 20px; min-height:146px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 0%,rgba(255,225,167,.18),transparent 34%),
      linear-gradient(145deg,#a2382b 0%,#87291f 62%,#702119 100%);
  }
  .header::before {
    top:auto; left:-32px; bottom:-64px; width:160px; height:160px; border-radius:50%;
    border:1px solid rgba(232,199,138,.13); background:transparent;
    box-shadow:0 0 0 20px rgba(232,199,138,.035),0 0 0 42px rgba(232,199,138,.025);
  }
  .header::after { width:34px; height:2px; opacity:.9; }
  .header h1 {
    display:flex; align-items:center; justify-content:center; text-shadow:none;
  }
  .brand-logo { width:96px; height:84px; display:block; flex:0 0 auto; overflow:visible; }
  .header .sub { margin-top:8px; font-size:10px; letter-spacing:1.2px; opacity:.76; }
  .updated {
    margin-top:9px; padding:3px 9px; border-radius:999px; font-size:9px; opacity:.72;
    background:rgba(255,255,255,.08); letter-spacing:.3px;
  }
  .refresh-btn {
    top:14px; right:14px; width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.1);
    font-size:21px; font-weight:300;
  }

  .notice {
    margin:12px 12px 10px; padding:13px 14px 12px; border-radius:18px;
    background:rgba(255,255,255,.82); border:1px solid #e8e0d6;
    color:#756b63; font-size:11px; line-height:1.55; box-shadow:0 5px 20px rgba(65,45,31,.045);
  }
  .notice-head { display:flex; align-items:center; gap:7px; margin-bottom:10px; color:#4c433d; }
  .notice-icon {
    width:18px; height:18px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    background:#b87b31; color:#fff; font:700 11px/1 Georgia,serif;
  }
  .notice-head b { font-size:12px; color:#4c433d; }
  .notice-rules { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .notice-rule {
    display:flex; align-items:baseline; justify-content:center; gap:5px;
    padding:8px 7px; border-radius:11px; background:#f7f4ef; color:#756b63;
  }
  .notice-rule strong { color:#963328; font-size:13px; }
  .notice-rule.service { background:#fff6e7; color:#86662e; }
  .notice-rule.service strong { color:#b27725; }
  .notice-foot { margin-top:8px; color:#9a9189; font-size:9px; text-align:center; }

  .store-bar {
    top:0; gap:7px; padding:10px 12px 11px; border-top:1px solid rgba(255,255,255,.75);
    border-bottom-color:#eae4dc; background:rgba(250,248,245,.9);
    box-shadow:0 5px 18px rgba(65,44,28,.055);
  }
  .store-btn {
    min-height:38px; padding:8px 15px; border-radius:12px; background:#fff;
    border-color:#ebe5de; color:#746960; font-size:11px; font-weight:500;
    box-shadow:0 2px 8px rgba(55,39,28,.035);
  }
  .store-btn:first-child::before { content:"▦"; margin-right:5px; font-size:12px; }
  .store-btn.active {
    background:linear-gradient(135deg,#ad3d2e,#8f2f24); border-color:transparent;
    box-shadow:0 5px 14px rgba(143,47,36,.24); color:#fff;
  }

  .banner {
    margin:12px 12px 0; padding:13px 15px; border-radius:16px;
    background:#fff9e9; border-color:#ecd7a9; border-left-width:3px;
    color:#796124; box-shadow:0 5px 18px rgba(109,78,20,.045);
  }
  .banner .t { color:#705516; font-size:12px; }
  .banner .t::before { content:""; width:7px; height:7px; border-radius:50%; background:#dca333; box-shadow:0 0 0 4px rgba(220,163,51,.12); }

  .card {
    margin:12px; padding:17px; border-radius:20px; border-color:rgba(235,229,221,.9);
    box-shadow:var(--shadow);
  }
  .card h2 { margin-bottom:13px; gap:9px; color:#332d29; font-size:15px; letter-spacing:.1px; }
  .card h2 .dot { width:8px; height:8px; box-shadow:0 0 0 4px rgba(0,0,0,.035); }
  .card h2 .store-name {
    max-width:50%; overflow:hidden; text-overflow:ellipsis; color:#9a918a;
    background:#f7f4f0; padding:3px 8px; border-radius:8px;
  }

  .chips-wrap { gap:7px; padding-left:0; }
  .closed-day {
    padding:8px 10px; border-radius:12px; background:#fff9f7; border-color:#efddd8;
    box-shadow:none;
  }
  .closed-day .cd-date { font-size:11px; }
  .closed-day .m { padding:3px 8px; font-size:9px; letter-spacing:.5px; }
  .closed-day .m.lunch { background:#568fc8; }
  .closed-day .m.dinner { background:#8c68ad; }

  .legend {
    display:grid; grid-template-columns:repeat(4,max-content); justify-content:space-between;
    gap:7px; margin:0 0 16px; padding:9px 10px; border-radius:12px;
    background:#faf8f5; font-size:9px;
  }
  .legend span { gap:4px; white-space:nowrap; }
  .legend i { width:10px; height:10px; border-radius:3px; }
  .legend .i-open { background:#eaf7f0; border:1px solid #91d1b1; }
  .legend .i-half { background:linear-gradient(to bottom,#f9dfdc 50%,#fbfaf8 50%); border:1px solid #e9c4c0; }
  .legend .i-full { background:#fff5e7; border:1px solid #e8bd7d; }
  .legend .i-closed { background:#fff0ef; border:1px solid #e79b96; }

  .availability-summary {
    display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:-2px 0 10px;
  }
  .availability-stat {
    padding:8px 6px; border:1px solid #ebe6df; border-radius:12px;
    background:#faf8f5; text-align:center; color:#8b8179; font-size:9px;
  }
  .availability-stat strong { display:block; margin-bottom:1px; font-size:17px; line-height:1.15; color:#4f4741; }
  .availability-stat.open strong { color:#27875c; }
  .availability-stat.partial strong { color:#c4832c; }
  .availability-stat.closed strong { color:#c94c45; }

  .cal-nav { margin-bottom:13px; }
  .cal-nav button {
    min-width:62px; min-height:36px; padding:7px 12px; border-radius:11px;
    background:#f7f4f0; border:1px solid #eee8e1; color:#776b62; font-size:11px;
  }
  .cal-nav .ym { font-size:16px; letter-spacing:.5px; }
  .cal-head { margin-bottom:7px; color:#aaa19a; font-size:9px; }
  .cal-head, .cal-grid { gap:5px; }
  .day {
    border-radius:11px; background:#fbfaf8; border-color:#eee9e3;
    box-shadow:none; min-width:0;
  }
  .day .d { font-size:13px; }
  .day .tag { font-size:7px; margin-top:2px; transform:scale(.96); }
  .day.open { background:#eaf7f0; border-color:#bfe4d1; color:#237951; box-shadow:none; }
  .day.open .tag { color:#348461; }
  .day.closed { background:#fff0ef; border-color:#f1c7c4; color:#c94b44; box-shadow:none; }
  .day.closed .tag { color:#d35b54; }
  .day.full { background:#fff5e7; border-color:#f1d5ab; color:#b87523; box-shadow:none; }
  .day.full .tag { color:#c1853d; }
  .day.today { outline:2px solid #9f3528; outline-offset:1px; }
  .day.half .half-bar.top, .day.half .half-bar.bottom { background:#f9dfdc; }
  .day.half-top .d { color:#b9433d; }
  .day.half-top .tag { color:#b9433d; }
  .day.half-bottom .d { color:#332d29; }

<script>
// ============ 数据加载 ============
var DATA_URL = "schedule.json";
var LS_KEY = "schedule_snapshot_v1";
var LS_STORE = "schedule_store_v1";
var LS_STORE_ID = "schedule_store_id_v1";
var LS_CACHE = "schedule_cache_v1";

var state = {
  data: null,        // 最新档期数据
  lastSeen: null,    // 用户上次看到的数据（localStorage）
  storeIndex: 0,     // 当前选中的门店
  year: 0, month: 0, // 当前显示的月份
  changedDates: {}   // date -> 'closed' | 'open' 本次新增的变化
};

// ============ 工具函数 ============
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function weekdayCN(d) { return "日一二三四五六"[d.getDay()]; }
function storeDisplayName(s) { return s.name || s.store_name || ""; }
function compareStoreOrder(a, b) {
  var rank = { "上海": 0, "杭州": 1, "深圳": 2 };
  var an = storeDisplayName(a), bn = storeDisplayName(b);
  var ac = an.split("·")[0], bc = bn.split("·")[0];
  var ar = rank[ac] !== undefined ? rank[ac] : 99;
  var br = rank[bc] !== undefined ? rank[bc] : 99;
  if (ar !== br) return ar - br;
  return an.localeCompare(bn, "zh");
}
function parseISO(s) {
  var p = s.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

// 当天截止时间（开场时间为界）：午宴 11:50 后不可订，晚宴 18:50 后不可订
var LUNCH_DEADLINE = 11 * 60 + 50;    // 11:50
var DINNER_DEADLINE = 18 * 60 + 50;   // 18:50

function mealExpired(ds, meal) {
  // ds: 'YYYY-MM-DD'，meal: 'lunch' | 'dinner'
  if (ds !== fmtDate(new Date())) return false;
  var now = new Date();
  var minutes = now.getHours() * 60 + now.getMinutes();
  if (meal === "lunch") return minutes >= LUNCH_DEADLINE;
  if (meal === "dinner") return minutes >= DINNER_DEADLINE;
  return false;
}

// ============ 实时数据接口（后台统计接口，无账号只读） ============
var API_BASE = "https://xy.duoxijoy.cn/api/xuyan";
var ADMIN_API = "https://xy.duoxijoy.cn/adminapi";
var CITY_LIST_URL = "https://xy.duoxijoy.cn/api/xuyan/get_city_list";
var DATES_URL = API_BASE + "/schedule/dates";
var PAGE_LIST_URL = API_BASE + "/schedule/pagination_list";
var DAY_SCHED_URL = ADMIN_API + "/statistic/day/schedules";
var DASHBOARD_URL = ADMIN_API + "/statistic/schedule/dashboard/";
var STORE_CONCURRENCY = 3; // 门店级并发，避免全部门店同时打满浏览器连接
var REQUEST_TIMEOUT = 12000;
var apiInFlight = {};

function apiGet(url, params) {
  var qs = "";
  if (params) {
    var parts = [];
    for (var k in params) parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
    qs = "?" + parts.join("&");
  }
  var requestUrl = url + qs;
  // 同一个 GET 在快速切换门店、自动刷新重叠时只发一次。
  if (apiInFlight[requestUrl]) return apiInFlight[requestUrl];
  var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = controller ? setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT) : null;
  var request = fetch(requestUrl, {
    cache: "no-store",
    signal: controller ? controller.signal : undefined
  }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (data) {
    if (timer) clearTimeout(timer);
    return data;
  }, function (err) {
    if (timer) clearTimeout(timer);
    throw err;
  });
  apiInFlight[requestUrl] = request;
  return request.then(function (data) {
    delete apiInFlight[requestUrl];
    return data;
  }, function (err) {
    delete apiInFlight[requestUrl];
    throw err;
  });
}

// ============ 门店数据缓存（60秒内存缓存，避免重复请求） ============
var storeCache = {};
var storeInFlight = {};
var windowInFlight = {};
var CACHE_TTL = 60 * 1000; // 60 秒

function cacheGet(key) {
  var c = storeCache[key];
  if (c && Date.now() - c.t < CACHE_TTL) return c.v;
  return null;
}
function cacheSet(key, val) {
  storeCache[key] = { t: Date.now(), v: val };
}

// 并发限制：同时最多发 MAX_CONC 个请求
function runBatch(tasks, maxConcurrent) {
  var idx = 0;
  var results = new Array(tasks.length);
  function next() {
    if (idx >= tasks.length) return Promise.resolve();
    var i = idx++;
    return Promise.resolve().then(tasks[i]).then(function (r) { results[i] = r; }).catch(function () { results[i] = null; })
      .then(function () { return next(); });
  }
  var workers = [];
  for (var w = 0; w < Math.min(maxConcurrent, tasks.length); w++) workers.push(next());
  return Promise.all(workers).then(function () { return results; });
}

// full_rate 只有 MM.DD：在上一年、当年、下一年中选择距离今天最近的日期。
// 这样 1 月不会把上一年 12 月误认成当年年底，12 月也能正确识别下一年 1 月。
function resolveScheduleDate(mmdd, referenceDate) {
  var parts = String(mmdd || "").split(".");
  var month = +parts[0], day = +parts[1];
  var now = referenceDate || new Date();
  var best = null, bestDistance = Infinity;
  [now.getFullYear() - 1, now.getFullYear(), now.getFullYear() + 1].forEach(function (year) {
    var candidate = new Date(year, month - 1, day, 12, 0, 0);
    if (candidate.getMonth() !== month - 1 || candidate.getDate() !== day) return;
    var distance = Math.abs(candidate.getTime() - now.getTime());
    if (distance < bestDistance) { best = candidate; bestDistance = distance; }
  });
  return best ? fmtDate(best) : null;
}

// 从后台 full_rate 拿近期窗口（约25天），避免逐日扫描
function fetchRecentWindow(storeId, force) {
  var cacheKey = "window_" + storeId;
  if (windowInFlight[cacheKey]) return windowInFlight[cacheKey];
  var cached = cacheGet(cacheKey);
  if (cached && !force) return Promise.resolve(cached);
  var request = Promise.all([
    apiGet(ADMIN_API + "/statistic/schedule/full_rate", { store_id: storeId, banquet_type: 1 }),
    apiGet(ADMIN_API + "/statistic/schedule/full_rate", { store_id: storeId, banquet_type: 2 })
  ]).then(function (res) {
    var lunch = res[0].data || [];
    var dinner = res[1].data || [];
    var dayMap = {};
    lunch.forEach(function (x) {
      var ds = resolveScheduleDate(x.scheduleTime);
      if (!ds) return;
      if (!dayMap[ds]) dayMap[ds] = {};
      dayMap[ds].lunch = { id: x.scheduleId, booking: x.bookingCount, total: x.totalCount, lock: x.lockCount };
    });
    dinner.forEach(function (x) {
      var ds = resolveScheduleDate(x.scheduleTime);
      if (!ds) return;
      if (!dayMap[ds]) dayMap[ds] = {};
      dayMap[ds].dinner = { id: x.scheduleId, booking: x.bookingCount, total: x.totalCount, lock: x.lockCount };
    });
    cacheSet(cacheKey, dayMap);
    return dayMap;
  });
  windowInFlight[cacheKey] = request;
  return request.then(function (dayMap) {
    delete windowInFlight[cacheKey];
    return dayMap;
  }, function (err) {
    delete windowInFlight[cacheKey];
    throw err;
  });
}

// 实时拉取某门店档期状态（后台接口：能看到未对外的完整档期）
function fetchStoreRealTime(store, force) {
  var cacheKey = "store_" + store.id;
  if (storeInFlight[cacheKey]) return storeInFlight[cacheKey];
  var cached = cacheGet(cacheKey);
  if (cached && !force) return Promise.resolve(cached);

  var request = fetchRecentWindow(store.id, force).then(function (windowMap) {
    var todayStr = fmtDate(new Date());
    var dayMap = {};
    // 先放窗口数据
    Object.keys(windowMap).forEach(function (ds) { dayMap[ds] = windowMap[ds]; });
    // 只扫描显示范围内的日期（本周+2周到maxDate），窗口外的场次才需要 dashboard
    var nowD = new Date();
    var daysToSunday = (7 - nowD.getDay()) % 7;
    var maxDate = fmtDate(new Date(nowD.getTime() + (daysToSunday + 14) * 24 * 3600 * 1000));
    var scanDays = [];
    var cursor = parseISO(todayStr);
    var endD = parseISO(maxDate);
    while (cursor <= endD) {
      var ds = fmtDate(cursor);
      if (!dayMap[ds]) scanDays.push(ds);
      cursor.setDate(cursor.getDate() + 1);
    }
    var scanTasks = scanDays.map(function (dayStr) {
      return function () {
        return apiGet(DAY_SCHED_URL, { store_id: store.id, date: dayStr }).then(function (r) {
          var items = r.data || [];
          var m = {};
          items.forEach(function (it) {
            var meal = it.banquetType === 1 ? "lunch" : (it.banquetType === 2 ? "dinner" : null);
            if (meal) m[meal] = { id: it.id, booking: null, total: null, lock: null, sessionOnly: true };
          });
          dayMap[dayStr] = m;
        });
      };
    });
    // 并发扫描（每批 8 个）
    return runBatch(scanTasks, 8).then(function () {
      // 清理：去掉完全没有场次的日期
      Object.keys(dayMap).forEach(function (ds) {
        var m = dayMap[ds];
        if (!m.lunch && !m.dinner) delete dayMap[ds];
      });
      // 对缺少 booking 数据的场次拉 dashboard（并发批次）
      var dashTasks = [];
      Object.keys(dayMap).forEach(function (ds) {
        var m = dayMap[ds];
        ["lunch", "dinner"].forEach(function (meal) {
          var s = m[meal];
          // full_rate 已经包含预订、总数和锁位，不再重复请求 dashboard。
          // scheduleState 不参与业务判定；只有逐日扫描得到的场次才需要补齐统计。
          if (s && s.id && (s.booking === null || s.total === null || s.lock === null)) {
            dashTasks.push(function () {
              return apiGet(DASHBOARD_URL + s.id, {}).then(function (dr) {
                var dd = dr.data || {};
                s.booking = dd.bookingSeatCount;
                s.total = dd.allSeatsCount;
                s.lock = dd.seatLockCount;
                s.fullDes = dd.fullStateDes;
                s.scheduleState = dd.scheduleState;
              });
            });
          }
        });
      });
      return runBatch(dashTasks, 8);
    }).then(function () {
      // 组装与线上相同结构（只保留今天及以后）
      var lunchClosed = [], dinnerClosed = [], open = [], full = [], closed = [];
      // 先计算范围：从今天到最后一个有场次的日期
      var allKeys = Object.keys(dayMap).filter(function (ds) { return ds >= todayStr; }).sort();
      var rangeEnd2 = allKeys.length ? allKeys[allKeys.length - 1] : todayStr;
      if (rangeEnd2 > maxDate) rangeEnd2 = maxDate;
      // 范围内缺失的日期 = 关闭（店休/未开放），与线上一致
      var cursor2 = parseISO(todayStr);
      var endD2 = parseISO(rangeEnd2);
      while (cursor2 <= endD2) {
        var ds2 = fmtDate(cursor2);
        if (!dayMap[ds2]) {
          lunchClosed.push(ds2); dinnerClosed.push(ds2); closed.push(ds2);
        }
        cursor2.setDate(cursor2.getDate() + 1);
      }
      Object.keys(dayMap).forEach(function (ds) {
        if (ds < todayStr || ds > maxDate) return; // 只组装展示窗口
        var m = dayMap[ds];
        var lunchState = "closed", dinnerState = "closed";
        if (m.lunch && m.lunch.id) {
          // 已建场次即可预订：未约满(booking<total) 且 未全锁(lock<total) = 可订
          if (m.lunch.booking !== null && m.lunch.total !== null &&
              m.lunch.booking < m.lunch.total && (m.lunch.lock || 0) < m.lunch.total) {
            lunchState = "open";
          } else lunchState = "full";
        }
        if (m.dinner && m.dinner.id) {
          if (m.dinner.booking !== null && m.dinner.total !== null &&
              m.dinner.booking < m.dinner.total && (m.dinner.lock || 0) < m.dinner.total) {
            dinnerState = "open";
          } else dinnerState = "full";
        }
        if (lunchState !== "open") lunchClosed.push(ds);
        if (dinnerState !== "open") dinnerClosed.push(ds);
        if (lunchState === "open" || dinnerState === "open") open.push(ds);
        else if (lunchState === "full" || dinnerState === "full") full.push(ds);
        else closed.push(ds);
      });
      var allDays = Object.keys(dayMap).sort();
      return {
        store_id: store.id,
        store_name: store.name,
        open_dates: open.sort(),
        full_dates: full.sort(),
        closed_dates: closed.sort(),
        lunch_closed_dates: lunchClosed.sort(),
        dinner_closed_dates: dinnerClosed.sort(),
        range_start: todayStr,
        range_end: rangeEnd2,
        realtime: true,
        backend: true
      };
    }).then(function (result) {
      cacheSet(cacheKey, result);
      return result;
    });
  });
  storeInFlight[cacheKey] = request;
  return request.then(function (result) {
    delete storeInFlight[cacheKey];
    return result;
  }, function (err) {
    delete storeInFlight[cacheKey];
    throw err;
  });
}

// ============ 门店 ============
var ALL_STORES = -1;   // storeIndex 特殊值：汇总视图

function curStore() {
  return state.data.stores[state.storeIndex];
}

function renderStoreBar() {
  var bar = document.getElementById("storeBar");
  bar.innerHTML = "";
  // 汇总按钮
  var allBtn = document.createElement("button");
  allBtn.className = "store-btn" + (state.storeIndex === ALL_STORES ? " active" : "");
  allBtn.textContent = "全部汇总";
  allBtn.onclick = function () {
    state.storeIndex = ALL_STORES;
    saveStoreSelection();
    renderStoreBar();
    renderAll();
    // 切换视图优先复用 60 秒缓存；手动点刷新才强制重拉。
    refreshAllStores(false);
  };
  bar.appendChild(allBtn);
  // 各门店按钮
  state.data.stores.forEach(function (s, i) {
    var btn = document.createElement("button");
    btn.className = "store-btn" + (i === state.storeIndex ? " active" : "");
    btn.textContent = s.store_name;
    btn.onclick = function () {
      state.storeIndex = i;
      saveStoreSelection();
      renderStoreBar();
      renderAll();
      refreshStoreData(s.store_id, false);
    };
    bar.appendChild(btn);
  });
}

// ============ 日历渲染 ============
function renderCalendar() {
  var grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  document.getElementById("calTitle").textContent = state.year + "年" + (state.month + 1) + "月";
  var first = new Date(state.year, state.month, 1);
  var daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
  var startWeek = first.getDay();
  var s = curStore();
  var lunchClosedSet = {}, dinnerClosedSet = {};
  (s.lunch_closed_dates || []).forEach(function (d) { lunchClosedSet[d] = 1; });
  (s.dinner_closed_dates || []).forEach(function (d) { dinnerClosedSet[d] = 1; });
  // 展示范围：范围外的日期不标记（灰色/未开放）
  var rangeStart = s.range_start || "0000-00-00";
  var rangeEnd = s.range_end || "9999-99-99";
  // 同步列表规则：仅显示今天这周（到本周日）+ 后面 3 整周，超出范围的日期隐藏
  var todayStr = fmtDate(new Date());
  var nowD = new Date();
  var daysToSunday = (7 - nowD.getDay()) % 7;
  var maxDate = fmtDate(new Date(nowD.getTime() + (daysToSunday + 14) * 24 * 3600 * 1000));
  if (maxDate < rangeEnd) rangeEnd = maxDate;

  // 展示窗口档期概览，帮助用户先看总体情况再查看具体日期。
  var stats = { open: 0, partial: 0, closed: 0 };
  var statsStart = rangeStart > todayStr ? rangeStart : todayStr;
  if (statsStart <= rangeEnd) {
    var statsCursor = parseISO(statsStart);
    var statsEnd = parseISO(rangeEnd);
    while (statsCursor <= statsEnd) {
      var statsDate = fmtDate(statsCursor);
      var statsLunchExpired = mealExpired(statsDate, "lunch");
      var statsDinnerExpired = mealExpired(statsDate, "dinner");
      var statsLunchClosed = statsLunchExpired ? false : !!lunchClosedSet[statsDate];
      var statsDinnerClosed = statsDinnerExpired ? false : !!dinnerClosedSet[statsDate];
      if ((statsLunchExpired && statsDinnerExpired) || (statsLunchClosed && statsDinnerClosed)) stats.closed++;
      else if (statsLunchClosed || statsDinnerClosed) stats.partial++;
      else stats.open++;
      statsCursor.setDate(statsCursor.getDate() + 1);
    }
  }
  document.getElementById("availabilitySummary").innerHTML =
    '<div class="availability-stat open"><strong>' + stats.open + '</strong>可预约天数</div>' +
    '<div class="availability-stat partial"><strong>' + stats.partial + '</strong>部分可约</div>' +
    '<div class="availability-stat closed"><strong>' + stats.closed + '</strong>不可预约</div>';

  var cells = [];
  for (var i = 0; i < startWeek; i++) cells.push('<div class="day other-month"></div>');
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = state.year + "-" + pad(state.month + 1) + "-" + pad(d);
    var lExpired = mealExpired(ds, "lunch");
    var dExpired = mealExpired(ds, "dinner");
    // 过点的餐别直接不显示（不参与状态判定）
    var lc = lExpired ? false : !!lunchClosedSet[ds];   // 午宴不可约
    var dc = dExpired ? false : !!dinnerClosedSet[ds];  // 晚宴不可约
    var cls = ["day"];
    var tag = "";
    var halfBars = "";
    var inRange = ds >= rangeStart && ds <= rangeEnd;

    if (ds > maxDate) {
      // 超出范围（本周+2周）：显示为"未开放"（灰色，不标红绿）
      tag = "未开放";
    } else if (lExpired && dExpired) {
      // 两餐都已过点：当天不再显示可预订状态
      cls.push("closed");
      tag = "今日已过";
    } else if (inRange && lc && dc) {
      cls.push("closed");
      tag = "不可约";
    } else if (inRange && (lc || dc)) {
      cls.push("half");
      cls.push(lc ? "half-top" : "half-bottom");
      tag = lc ? "午宴不可约" : "晚宴不可约";
      halfBars = lc
        ? '<span class="half-bar top"></span>'
        : '<span class="half-bar bottom"></span>';
    } else if (inRange) {
      cls.push("open");
      tag = "可约";
    } else {
      tag = "未开放";
    }
    if (ds === todayStr) cls.push("today");
    if (state.changedDates[ds]) cls.push("changed");
    cells.push('<div class="' + cls.join(" ") + '" data-date="' + ds + '">' + halfBars + '<span class="d">' + d + '</span><span class="tag">' + tag + '</span></div>');
  }
  while (cells.length % 7 !== 0) cells.push('<div class="day other-month"></div>');
  grid.innerHTML = cells.join("");
}

// ============ 列表渲染（单店，横向标签） ============
function renderList() {
  var s = curStore();
  var el = document.getElementById("closedDays");
  var todayStr = fmtDate(new Date());
  // 与汇总视图一致：仅显示今天这周（到本周日）+ 后面 3 整周 = 21~28 天
  var now = new Date();
  var daysToSunday = (7 - now.getDay()) % 7;
  var maxDate = fmtDate(new Date(now.getTime() + (daysToSunday + 14) * 24 * 3600 * 1000));
  // 合并午宴/晚宴不可约日期 -> 按天聚合（仅显示明天起到范围内，过点餐别不显示）
  var dayMap = {};
  (s.lunch_closed_dates || []).forEach(function (d) { if (d > todayStr && d <= maxDate && !mealExpired(d, "lunch")) { if (!dayMap[d]) dayMap[d] = {}; dayMap[d].lunch = true; } });
  (s.dinner_closed_dates || []).forEach(function (d) { if (d > todayStr && d <= maxDate && !mealExpired(d, "dinner")) { if (!dayMap[d]) dayMap[d] = {}; dayMap[d].dinner = true; } });
  var days = Object.keys(dayMap).sort();

  if (!days.length) {
    el.innerHTML = '<div class="none">✅ 近期均可预约</div>';
    return;
  }
  var MAX = 30;
  var show = days.slice(0, MAX);
  el.innerHTML = '<div class="chips-wrap">' + show.map(function (d) {
    var dt = parseISO(d);
    var meals = [];
    if (dayMap[d].lunch) meals.push('<span class="m lunch">午宴</span>');
    if (dayMap[d].dinner) meals.push('<span class="m dinner">晚宴</span>');
    var label = meals.length ? meals.join("") : '<span class="m none">全天</span>';
    return '<span class="closed-day"><span class="cd-date">' + (dt.getMonth() + 1) + "月" + dt.getDate() + "日 <span class='w'>周" + weekdayCN(dt) + "</span></span><span class='cd-meals'>" + label + "</span></span>";
  }).join("") + "</div>" + (days.length > MAX ? '<div class="none">...共 ' + days.length + " 天不可预约</div>" : "");
}

// ============ 列表渲染（汇总视图：按城市/门店整合，仅显示近3周） ============
function renderAllStores() {
  var el = document.getElementById("closedDays");
  var todayStr = fmtDate(new Date());
  // 仅显示：今天这周（到本周日）+ 后面 3 整周 = 21~28 天（取决于今天是周几）
  var now = new Date();
  var daysToSunday = (7 - now.getDay()) % 7; // 到本周日的天数（0=周日当天）
  var maxDate = fmtDate(new Date(now.getTime() + (daysToSunday + 14) * 24 * 3600 * 1000));
  var CITY_ORDER = ["上海", "杭州", "深圳"];
  var cityCounts = {};

  // 按城市分组
  var groups = {};
  state.data.stores.forEach(function (s) {
    var city = (s.store_name || "").split("·")[0];
    if (CITY_ORDER.indexOf(city) === -1) return;
    if (!groups[city]) groups[city] = [];
    groups[city].push(s);
  });

  var html = "";
  var totalDays = 0;
  CITY_ORDER.forEach(function (city) {
    var stores = groups[city];
    if (!stores) return;
    var cityDays = 0;
    html += '<div class="city-group"><div class="city-title">' + city + '<span class="count" id="cityCount-' + city + '"></span></div>';
    stores.forEach(function (s) {
      // 聚合该门店不可约日期 -> 按天（明天起 21 天内，过点餐别不显示）
      var dayMap = {};
      (s.lunch_closed_dates || []).forEach(function (d) { if (d > todayStr && d <= maxDate && !mealExpired(d, "lunch")) { if (!dayMap[d]) dayMap[d] = {}; dayMap[d].lunch = true; } });
      (s.dinner_closed_dates || []).forEach(function (d) { if (d > todayStr && d <= maxDate && !mealExpired(d, "dinner")) { if (!dayMap[d]) dayMap[d] = {}; dayMap[d].dinner = true; } });
      var days = Object.keys(dayMap).sort();
      if (!days.length) return;
      cityDays += days.length;
      html += '<div class="store-sub">' + s.store_name + '<span class="s-count">' + days.length + " 天不可约</span></div>";
      var MAX = 15;
      var show = days.slice(0, MAX);
      html += '<div class="chips-wrap">';
      show.forEach(function (d) {
        var dt = parseISO(d);
        var meals = [];
        if (dayMap[d].lunch) meals.push('<span class="m lunch">午宴</span>');
        if (dayMap[d].dinner) meals.push('<span class="m dinner">晚宴</span>');
        var label = meals.length ? meals.join("") : '<span class="m none">全天</span>';
        html += '<span class="closed-day"><span class="cd-date">' + (dt.getMonth() + 1) + "月" + dt.getDate() + "日 <span class='w'>周" + weekdayCN(dt) + "</span></span><span class='cd-meals'>" + label + "</span></span>";
      });
      html += "</div>";
      if (days.length > MAX) html += '<div class="none">...共 ' + days.length + " 天</div>";
    });
    // 城市统计（渲染后填充）
    html += "</div>";
    totalDays += cityDays;
    cityCounts[city] = cityDays;
  });

  el.innerHTML = totalDays ? html : '<div class="none">✅ 近期均可预约</div>';
  // 填充城市统计徽标
  Object.keys(cityCounts).forEach(function (c) {
    var el2 = document.getElementById("cityCount-" + c);
    if (el2 && cityCounts[c] > 0) el2.textContent = cityCounts[c] + " 天";
  });
}

// ============ 档期变化对比（与上次数据对比，仅限本周+2周范围） ============
// 对比两个门店数据，返回该店的变化数组 [{store_id, date, status, detail}]
function compareStore(prevStore, curStoreData) {
  var changes = [];
  if (!prevStore || !curStoreData) return changes;
  var storeId = curStoreData.store_id;
  // 只对比展示范围内的日期（本周+2周）
  var todayStr = fmtDate(new Date());
  var nowD = new Date();
  var daysToSunday = (7 - nowD.getDay()) % 7;
  var maxDate = fmtDate(new Date(nowD.getTime() + (daysToSunday + 14) * 24 * 3600 * 1000));
  ["lunch", "dinner"].forEach(function (meal) {
    var prevList = prevStore[meal + "_closed_dates"] || [];
    var curList = curStoreData[meal + "_closed_dates"] || [];
    var prevSet = {}, curSet = {};
    prevList.forEach(function (d) { prevSet[d] = 1; });
    curList.forEach(function (d) { curSet[d] = 1; });
    var mealName = meal === "lunch" ? "午宴" : "晚宴";
    // 新增不可约：之前可约/未开放 → 现在不可约（仅范围内）
    curList.forEach(function (d) {
      if (d > todayStr && d <= maxDate && !prevSet[d]) changes.push({ store_id: storeId, date: d, status: "closed", detail: "新增不可约（" + mealName + "）" });
    });
    // 恢复可约：之前不可约 → 现在可约（仅范围内）
    prevList.forEach(function (d) {
      if (d > todayStr && d <= maxDate && !curSet[d]) changes.push({ store_id: storeId, date: d, status: "open", detail: "恢复可约（" + mealName + "）" });
    });
  });
  return changes;
}

// 对比全部门店，返回总 changes（旧基准数据 vs 新数据）
function compareAllStores(prevData, newData) {
  var changes = [];
  if (!prevData || !prevData.stores) return changes;
  var prevMap = {};
  prevData.stores.forEach(function (s) { prevMap[s.store_id] = s; });
  (newData.stores || []).forEach(function (s) {
    changes = changes.concat(compareStore(prevMap[s.store_id], s));
  });
  return changes;
}

// 从 localStorage 读上次数据（作为对比基准）
function readPrevData() {
  try {
    var c = JSON.parse(localStorage.getItem(LS_CACHE));
    return c && c.stores ? c : null;
  } catch (e) { return null; }
}

// 应用变化到当前视图（重新计算 changedDates + 横幅）
function applyChanges(changes) {
  var d = state.data;
  d.changes = changes || [];
  var isSummary = state.storeIndex === ALL_STORES;
  var s = isSummary ? null : curStore();
  var changed = {};
  (d.changes || []).forEach(function (c) {
    if (!isSummary && s && c.store_id === s.store_id) changed[c.date] = c.status;
  });
  state.changedDates = changed;
  renderBanner();
  renderAll();
}

// ============ 加载 / 刷新状态 ============
function showLoading() { document.getElementById("loadingMask").classList.remove("hide"); }
function hideLoading() { document.getElementById("loadingMask").classList.add("hide"); }
function showRefresh() {
  document.getElementById("refreshBar").classList.add("show");
  var b = document.getElementById("refreshBtn");
  if (b) b.classList.add("spinning");
}
function hideRefresh() {
  document.getElementById("refreshBar").classList.remove("show");
  var b = document.getElementById("refreshBtn");
  if (b) b.classList.remove("spinning");
}

function readSavedIndex() {
  try {
    var idx = parseInt(localStorage.getItem(LS_STORE), 10);
    return isNaN(idx) ? null : idx;
  } catch (e) { return null; }
}

function readSavedStoreId() {
  try {
    var value = localStorage.getItem(LS_STORE_ID);
    return value === null || value === "" ? null : value;
  } catch (e) { return null; }
}

function saveStoreSelection() {
  try {
    localStorage.setItem(LS_STORE, state.storeIndex);
    if (state.storeIndex === ALL_STORES || !state.data || !curStore()) {
      localStorage.removeItem(LS_STORE_ID);
    } else {
      localStorage.setItem(LS_STORE_ID, String(curStore().store_id));
    }
  } catch (e) {}
}

function findStoreIndexById(stores, storeId) {
  if (storeId === null || storeId === undefined) return -1;
  for (var i = 0; i < stores.length; i++) {
    if (String(stores[i].store_id) === String(storeId)) return i;
  }
  return -1;
}

// 用实时门店列表重建顺序，同时按 store_id 保持用户选中的门店。
function reconcileStoreList(definitions, preferredStoreId, keepSummary) {
  if (!state.data || !state.data.stores) return;
  var existing = {};
  state.data.stores.forEach(function (s) { existing[String(s.store_id)] = s; });
  var ordered = definitions.slice().sort(compareStoreOrder).map(function (d) {
    var item = existing[String(d.id)];
    if (item) item.store_name = d.name;
    return item;
  }).filter(Boolean);
  state.data.stores = ordered;
  if (keepSummary) {
    state.storeIndex = ALL_STORES;
  } else {
    var index = findStoreIndexById(ordered, preferredStoreId);
    state.storeIndex = index >= 0 ? index : 0;
  }
  saveStoreSelection();
}

// 先用上次缓存立即渲染，再后台刷新，避免打开页面白屏
function renderFromCache() {
  try {
    var cached = JSON.parse(localStorage.getItem(LS_CACHE));
    if (cached && cached.stores && cached.stores.length) {
      state.data = cached;
      var savedIdx = readSavedIndex();
      var savedStoreId = readSavedStoreId();
      if (savedIdx === ALL_STORES) state.storeIndex = ALL_STORES;
      else {
        var savedStoreIndex = findStoreIndexById(cached.stores, savedStoreId);
        if (savedStoreIndex >= 0) state.storeIndex = savedStoreIndex;
        else if (savedIdx !== null && cached.stores[savedIdx]) state.storeIndex = savedIdx;
      }
      renderStoreBar();
      renderAll();
      document.getElementById("updatedAt").textContent = "更新于 " + (cached.updated_at || "—") + "（缓存）";
      return true;
    }
  } catch (e) {}
  return false;
}

function refreshCurrent() {
  if (state.storeIndex === ALL_STORES) { refreshAllStores(true); return; }
  var s = curStore();
  if (s) refreshStoreData(s.store_id, true);
}

// ============ 页面初始化 ============
function renderAll() {
  var calCard = document.getElementById("calCard");
  if (state.storeIndex === ALL_STORES) {
    // 汇总视图：隐藏日历，显示整合列表
    calCard.style.display = "none";
    document.getElementById("listCardTitle").textContent = "全部门店不可预约日期（上海 杭州 深圳）";
    renderAllStores();
  } else {
    var s = curStore();
    calCard.style.display = "block";
    document.getElementById("curStore").textContent = s.store_name;
    document.getElementById("listCardTitle").textContent = "近期不可预约日期";
    renderCalendar();
    renderList();
  }
}

function applyData() {
  var d = state.data;
  var isSummary = state.storeIndex === ALL_STORES;
  var s = isSummary ? null : curStore();
  document.getElementById("updatedAt").textContent = "更新于 " + (d.updated_at || "—");

  // 变化：服务端/对比生成的 changes（按门店）
  var changed = {};
  (d.changes || []).forEach(function (c) {
    if (!isSummary && s && c.store_id === s.store_id) changed[c.date] = c.status;
  });
  state.changedDates = changed;

  renderBanner();
  renderStoreBar();
  renderAll();
  saveSnapshot();
}

// 横幅：汇总所有门店的变化
function renderBanner() {
  var d = state.data || { changes: [], stores: [] };
  var banner = document.getElementById("banner");
  var bannerText = document.getElementById("bannerText");
  var parts = [];
  var allChanged = {};
  (d.changes || []).forEach(function (c) {
    if (!allChanged[c.store_id]) allChanged[c.store_id] = {};
    allChanged[c.store_id][c.date] = c.status;
  });
  var storeNameMap = {};
  d.stores.forEach(function (st) { storeNameMap[st.store_id] = st.store_name; });
  Object.keys(allChanged).forEach(function (sid) {
    var perStore = allChanged[sid];
    var closed = [], open = [];
    Object.keys(perStore).forEach(function (date) {
      if (perStore[date] === "closed") closed.push(date);
      else open.push(date);
    });
    closed.sort(); open.sort();
    var name = storeNameMap[sid] || ("门店" + sid);
    var sub = [];
    if (closed.length) sub.push("新增不可预约 <b class='closed'>" + closed.map(function (x) { return x.slice(5).replace("-", "月") + "日"; }).join("、") + "</b>");
    if (open.length) sub.push("恢复可预约 <b class='open'>" + open.map(function (x) { return x.slice(5).replace("-", "月") + "日"; }).join("、") + "</b>");
    if (sub.length) parts.push("【" + name + "】" + sub.join("；"));
  });

  if (parts.length) {
    bannerText.innerHTML = "较上次数据，档期有更新：<br>" + parts.join("<br>");
    banner.className = "banner show";
  } else {
    banner.className = "banner";
    bannerText.innerHTML = "";
  }
}

function saveSnapshot() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      stores: (state.data.stores || []).map(function (s) {
        return { lunch_closed_dates: s.lunch_closed_dates, dinner_closed_dates: s.dinner_closed_dates };
      }),
      updated_at: state.data.updated_at
    }));
    localStorage.setItem(LS_CACHE, JSON.stringify(state.data));
  } catch (e) { /* 忽略 */ }
}

function realtimeStamp() {
  var now = new Date();
  return fmtDate(now) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + "（实时）";
}

function mergeFreshStore(fresh) {
  if (!fresh || !state.data || !state.data.stores) return;
  var stores = state.data.stores;
  for (var i = 0; i < stores.length; i++) {
    if (stores[i].store_id === fresh.store_id) {
      var changes = compareStore(stores[i], fresh);
      stores[i] = fresh;
      state.data.changes = (state.data.changes || []).filter(function (c) {
        return c.store_id !== fresh.store_id;
      }).concat(changes);
      return;
    }
  }
  stores.push(fresh);
}

// 当前门店更新完成后，其余门店静默补齐；不再让顶部“正在更新”一直等待全部门店。
function refreshOtherStoresInBackground(stores, skipStoreId) {
  var tasks = stores.filter(function (s) { return s.id !== skipStoreId; }).map(function (s) {
    return function () {
      return fetchStoreRealTime(s, true).then(function (fresh) { mergeFreshStore(fresh); });
    };
  });
  runBatch(tasks, STORE_CONCURRENCY).then(function () {
    reconcileStoreList(stores, readSavedStoreId(), state.storeIndex === ALL_STORES);
    state.data.updated_at = realtimeStamp();
    // 用户可能在后台更新期间切换了视图，结束时同步一次当前画面。
    applyData();
  });
}

function loadData() {
  var now = new Date();
  state.year = now.getFullYear();
  state.month = now.getMonth();
  var savedIdx = readSavedIndex();
  var savedStoreId = readSavedStoreId();

  // 先用缓存立即渲染（避免白屏），再后台拉取最新实时数据
  var hasCache = renderFromCache();
  if (hasCache) { hideLoading(); showRefresh(); }
  else { showLoading(); }

  // 首次访问也先用仓库内的快照秒开，再把当前门店替换成实时数据。
  var bootstrap = Promise.resolve(hasCache);
  if (!hasCache) {
    bootstrap = fetch(DATA_URL, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (json) {
      json.stores.sort(compareStoreOrder);
      state.data = json;
      if (savedIdx === ALL_STORES) state.storeIndex = ALL_STORES;
      else {
        var savedStoreIndex = findStoreIndexById(json.stores, savedStoreId);
        if (savedStoreIndex >= 0) state.storeIndex = savedStoreIndex;
        else if (savedIdx !== null && json.stores[savedIdx]) state.storeIndex = savedIdx;
      }
      hideLoading();
      showRefresh();
      applyData();
      return true;
    }).catch(function () { return false; });
  }

  // 优先实时拉取最新数据
  bootstrap.then(function (hasUsableData) {
    return apiGet(CITY_LIST_URL, {}).then(function (cityResp) {
    var stores = [];
    (cityResp.data || []).forEach(function (city) {
      (city.storeHallList || []).forEach(function (s) {
        if (s.id && (s.storeName || "").indexOf("下午茶") === -1) {
          stores.push({ id: s.id, name: s.storeName });
        }
      });
    });
    // 门店排序：上海 → 杭州 → 深圳 → 其他
    stores.sort(compareStoreOrder);
    if (!stores.length) throw new Error("门店列表为空");
    var keepSummary = state.storeIndex === ALL_STORES;
    var preferredStoreId = savedStoreId;
    if (preferredStoreId === null && savedIdx !== null && savedIdx !== ALL_STORES && curStore()) {
      preferredStoreId = curStore().store_id; // 兼容旧版只保存索引的用户
    }
    reconcileStoreList(stores, preferredStoreId, keepSummary);
    // 有本地缓存时，先只刷新用户正在看的门店；其余门店在后台静默补齐。
    if (hasUsableData && state.storeIndex !== ALL_STORES) {
      var selected = curStore();
      var selectedDef = stores.filter(function (s) { return selected && s.id === selected.store_id; })[0];
      if (!selectedDef && selected) selectedDef = { id: selected.store_id, name: selected.store_name };
      if (selectedDef) {
        return refreshStoreData(selectedDef.id, true).then(function () {
          refreshOtherStoresInBackground(stores, selectedDef.id);
        });
      }
    }
    if (hasUsableData && state.storeIndex === ALL_STORES) {
      return refreshAllStores(true, stores);
    }

    // 首次访问没有缓存：限制门店级并发，取消原先逐店 150ms 的固定等待。
    var tasks = stores.map(function (st) {
      return function () {
        return fetchStoreRealTime(st).catch(function () { return null; });
      };
    });
    return runBatch(tasks, STORE_CONCURRENCY).then(function (results) {
      var realStores = results.filter(Boolean);
      if (!realStores.length) throw new Error("实时数据获取失败");
      var prevData = readPrevData();
      state.data = {
        updated_at: realtimeStamp(),
        stores: realStores,
        changes: compareAllStores(prevData, { stores: realStores })
      };
      if (savedIdx === ALL_STORES) state.storeIndex = ALL_STORES;
      else {
        var realStoreIndex = findStoreIndexById(realStores, savedStoreId);
        if (realStoreIndex >= 0) state.storeIndex = realStoreIndex;
        else if (savedIdx !== null && realStores[savedIdx]) state.storeIndex = savedIdx;
      }
      hideLoading();
      hideRefresh();
      applyData();
    });
  });
  }).catch(function () {
    // 实时失败：回退静态 schedule.json
    return fetch(DATA_URL, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (json) {
      json.stores.sort(compareStoreOrder);
      state.data = json;
      if (savedIdx === ALL_STORES) state.storeIndex = ALL_STORES;
      else {
        var fallbackStoreIndex = findStoreIndexById(json.stores, savedStoreId);
        if (fallbackStoreIndex >= 0) state.storeIndex = fallbackStoreIndex;
        else if (savedIdx !== null && json.stores[savedIdx]) state.storeIndex = savedIdx;
      }
      hideLoading();
      hideRefresh();
      applyData();
    }).catch(function (err) {
      hideLoading();
      hideRefresh();
      document.getElementById("banner").innerHTML = "<div class='t'>⚠️ 数据加载失败</div><div>请检查网络后刷新页面（" + err.message + "）</div>";
      document.getElementById("banner").className = "banner show";
    });
  });
}

// 切换门店可复用短缓存；手动刷新时 force=true。
function refreshStoreData(storeId, force) {
  // 仅切换视图且缓存仍有效时不做无意义的“刷新”，也不清空变化提醒。
  if (!force && !storeInFlight["store_" + storeId] && cacheGet("store_" + storeId)) return Promise.resolve();
  showRefresh();
  var store = { id: storeId, name: "" };
  state.data.stores.forEach(function (s) { if (s.store_id === storeId) { store.name = s.store_name; } });
  return fetchStoreRealTime(store, !!force).then(function (fresh) {
    if (!fresh) return;
    mergeFreshStore(fresh);
    state.data.updated_at = realtimeStamp();
    applyData();
  }).catch(function () { /* 静默失败，保留旧数据 */ })
    .then(function () { hideRefresh(); });
}

// 刷新全部门店实时数据（汇总视图用）
function refreshAllStores(force, definitions) {
  var prevSnapshot = JSON.parse(JSON.stringify(state.data)); // 刷新前基准
  var source = definitions || state.data.stores.map(function (s) {
    return { id: s.store_id, name: s.store_name };
  });
  var targets = source.map(function (s) {
    return { id: s.id !== undefined ? s.id : s.store_id, name: s.name || s.store_name };
  }).sort(compareStoreOrder);
  var tasks = targets.filter(function (s) {
    return force || storeInFlight["store_" + s.id] || !cacheGet("store_" + s.id);
  }).map(function (s) {
    return function () {
      return fetchStoreRealTime(s, !!force).then(function (fresh) {
        if (fresh) mergeFreshStore(fresh);
      });
    };
  });
  if (!tasks.length) return Promise.resolve();
  showRefresh();
  return runBatch(tasks, STORE_CONCURRENCY).then(function () {
    reconcileStoreList(targets, readSavedStoreId(), state.storeIndex === ALL_STORES);
    if (force) state.data.changes = compareAllStores(prevSnapshot, state.data);
    state.data.updated_at = realtimeStamp();
    applyData();
  }).catch(function () {})
    .then(function () { hideRefresh(); });
}

function prevMonth() {
  state.month--;
  if (state.month < 0) { state.month = 11; state.year--; }
  renderCalendar();
}
function nextMonth() {
  state.month++;
  if (state.month > 11) { state.month = 0; state.year++; }
  renderCalendar();
}

loadData();
</script>
